# =========================================================
# testes.yml
# Workflow do GitHub Actions: roda os testes automaticamente
# toda vez que alguém der push na branch main
# =========================================================

# Nome do workflow — só aparece na aba "Actions" do GitHub
name: Rodar testes

# Gatilho: define o que faz esse workflow começar a rodar
on:
  push:                # dispara quando alguém der "git push"
    branches:
      - main            # só dispara se o push for na branch "main"

# Lista de trabalhos (jobs) que esse workflow vai executar
jobs:

  # Nome do job (escolhido por nós, pode ser qualquer coisa)
  testes:

    # Sistema operacional que o runner (máquina temporária) vai usar
    runs-on: ubuntu-latest

    # Lista de passos, executados em ordem, de cima pra baixo
    steps:

      # Passo 1: baixa o código do seu repositório pra dentro do runner
      # (sem isso, o runner nasceria vazio, sem seus arquivos)
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      # Passo 2: instala o Python dentro do runner
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # versão do Python a instalar

      # Passo 3: entra na pasta certa e instala o pytest
      # (sem venv aqui — o runner nasce limpo e morre no final,
      # então não existe risco de "sujar" nada que continue existindo)
      - name: Instalar as dependências
        run: |
          cd 05-cicd/app
          pip install pytest

      # Passo 4: entra na pasta certa de novo (cada passo é uma
      # sessão de terminal nova, não "lembra" do passo anterior)
      # e roda os testes de fato
      - name: Rodar os testes
        run: |
          cd 05-cicd/app
          pytest
