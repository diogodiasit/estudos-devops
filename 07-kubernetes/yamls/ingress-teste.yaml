apiVersion: networking.k8s.io/v1   # versão da API de rede, onde o Ingress mora
kind: Ingress                      # tipo do objeto: o "papel" com as regras
metadata:
  name: ingress-teste              # nome do Ingress
spec:
  ingressClassName: nginx          # qual porteiro (controller) lê essas regras
  rules:
  - http:                          # sem "host": vale para qualquer endereço (bom para teste)
      paths:
      - path: /app1                # caminho na URL
        pathType: Prefix           # vale para /app1 e tudo que começa com /app1/
        backend:
          service:
            name: svc-app1         # Service de destino (nome exato)
            port:
              number: 80           # porta do Service
      - path: /app2                # segundo caminho
        pathType: Prefix
        backend:
          service:
            name: svc-app2         # Service de destino (nome exato)
            port:
              number: 80
