# RESUMO: um Pod que só fica "pronto" (1/1) quando existe o arquivo /tmp/pronto.
# Serve para ver a readiness probe funcionando: você cria e apaga o arquivo,
# e o status do Pod muda.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: garcom                      # nome deste Deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garcom                   # etiqueta dos Pods que este Deployment cuida
  template:
    metadata:
      labels:
        app: garcom                 # etiqueta que o Pod recebe
    spec:
      containers:
      - name: garcom
        image: busybox:1.36
        command: ["sleep", "3600"]  # o container fica ligado por 1 hora

        readinessProbe:             # o teste de "está pronto para atender?"
          exec:                     # o teste é rodar um comando DENTRO do container
            command: ["cat", "/tmp/pronto"]  # se o arquivo existe, o comando dá certo = pronto
          initialDelaySeconds: 2    # espera 2 segundos depois de ligar antes do 1º teste
          periodSeconds: 5          # repete o teste a cada 5 segundos
