# RESUMO: um Pod que "funciona" por 20 segundos e depois "trava" (simulado).
# A liveness probe detecta a trava e o Kubernetes reinicia o container.
# O trecho que importa para a lógica é só o bloco livenessProbe.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozinheiro                  # nome deste Deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cozinheiro               # etiqueta dos Pods que este Deployment cuida
  template:
    metadata:
      labels:
        app: cozinheiro             # etiqueta que o Pod recebe
    spec:
      containers:
      - name: cozinheiro
        image: busybox:1.36
        # Ao ligar: cria /tmp/vivo, "funciona" 20s, apaga o arquivo (a "trava"), e segue ligado
        command: ["sh", "-c", "touch /tmp/vivo; sleep 20; rm /tmp/vivo; sleep 3600"]

        livenessProbe:              # o teste de "está vivo?"
          exec:                     # o teste é rodar um comando DENTRO do container
            command: ["cat", "/tmp/vivo"]  # arquivo existe = vivo; sumiu = travado
          initialDelaySeconds: 5    # espera 5s depois de ligar antes do 1º teste
          periodSeconds: 5          # repete o teste a cada 5 segundos
          failureThreshold: 2       # com 2 falhas seguidas, o container é reiniciado
